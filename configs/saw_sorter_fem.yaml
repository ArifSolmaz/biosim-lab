# Same device as ctc_vs_rbc.yaml, solved with the Gmsh + scikit-fem Helmholtz
# model instead of the closed-form standing wave.
#
# The FEM path resolves the vertical decay of the leaky SAW field, which the
# 1-D closed form ignores, so it predicts a LOWER recovery. See
# examples/04_validate_analytic_vs_fem.py for the quantified comparison.
name: ctc_vs_rbc_fem
instrument: saw_sorter
seed: 12345
output_dir: results
description: Single-node SAW separation solved by FEM (Helmholtz + Gor'kov).
params:
  frequency: 6.632 MHz
  voltage_pp: 15 V
  channel_width: 300 um
  channel_height: 50 um
  channel_length: 2 mm
  flow_rate: 5 uL/min
  fluid: water
  substrate: linbo3_128yx
  inlet: sheath_sides
  collection_fraction: 0.3333333333333333
  mode: fem
  fem_resolution: 48
  fem_grid: [241, 33]
  enable_vertical_arf: false   # see SAWSorterSimulation._fem_arf for why
  populations:
    - cell_type: mcf7
      count: 300
      target: true
    - cell_type: rbc
      count: 300
      target: false
