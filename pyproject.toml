[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosim-lab"
version = "0.1.0"
description = "Open-source, plugin-based virtual laboratory instrument platform for computational biomedical engineering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "biosim-lab contributors" }]
keywords = [
    "acoustofluidics", "microfluidics", "finite-element", "cell-sorting",
    "impedance", "cell-counting", "cell-tracking", "biomedical-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "xarray>=2024.1",
    "pandas>=2.2",
    "pint>=0.23",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "scikit-fem>=9.0",
    "plotly>=5.20",
    "panel>=1.4",
    "bokeh>=3.4",
    "pyvista>=0.43",
    "scikit-image>=0.22",
    "trackpy>=0.6",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "netCDF4>=1.6",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Gmsh has no wheel on every platform (notably linux/arm64), and the core does
# not need it: core.geometry falls back to an exact structured triangulation for
# the straight-channel template, which is what Stages 1-3 use. Only the PDMS
# wall-layer template genuinely requires it. Keeping it here is what lets the
# Docker image build on arm64 and still run the whole test suite.
mesh = ["gmsh>=4.12", "meshio>=5.3"]
imaging = ["napari[all]>=0.4.19", "btrack>=0.6"]
# StarDist needs TensorFlow, which publishes no wheels for Python 3.14 (verified
# against the index: 3.13 has them, 3.14 does not). The marker keeps this extra
# installable on a 3.14 interpreter — without it, `pip install biosim-lab[all]`
# would simply fail there — and `biosim doctor` reports the absence.
segmentation = [
    "cellpose>=3.0",
    "stardist>=0.9; python_version < '3.14'",
]
movie = ["imageio-ffmpeg>=0.4.9"]
fenicsx = ["fenics-dolfinx>=0.8"]
openfoam = ["fluidfoam>=0.2.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
# "all" now means all. It previously omitted `segmentation`, so the extra named
# all was the one that did not install the deep-learning segmenters. Note it
# pulls PyTorch and (below 3.14) TensorFlow, so it is a multi-hundred-megabyte
# install by nature; pick a narrower extra if that matters.
all = ["biosim-lab[mesh,imaging,segmentation,movie,dev,docs]"]

[project.urls]
Homepage = "https://github.com/biosim-lab/biosim-lab"
Documentation = "https://github.com/biosim-lab/biosim-lab/tree/main/docs"
Issues = "https://github.com/biosim-lab/biosim-lab/issues"

[project.scripts]
biosim = "biosim_lab.cli:app"

# --- plugin registries -----------------------------------------------------
# Third-party packages can add instruments and solvers by declaring the same
# entry-point groups; nothing in the core needs to change.
[project.entry-points."biosim_lab.instruments"]
saw_sorter = "biosim_lab.instruments.saw_sorter:SAWSorter"
impedance_rtca = "biosim_lab.instruments.impedance_rtca:ImpedanceRTCA"
cell_counter = "biosim_lab.instruments.cell_counter:CellCounter"
cell_tracker = "biosim_lab.instruments.cell_tracker:CellTracker"

[project.entry-points."biosim_lab.solvers"]
builtin_helmholtz = "biosim_lab.core.fem.helmholtz:HelmholtzSolver"
builtin_electroquasistatic = "biosim_lab.core.fem.electroquasistatic:ElectroQuasistaticSolver"
builtin_stokes = "biosim_lab.core.fem.stokes:StokesSolver"
openfoam = "biosim_lab.solvers.solver_openfoam:OpenFOAMSolver"
elmer = "biosim_lab.solvers.solver_elmer:ElmerSolver"

[tool.setuptools.packages.find]
include = ["biosim_lab*"]

[tool.setuptools.package-data]
"biosim_lab.solvers.solver_openfoam" = ["templates/*"]
"biosim_lab.solvers.solver_elmer" = ["templates/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: long-running tests (FEM solves, sweeps)",
    "optional_backend: needs an optional heavy solver (OpenFOAM, Elmer)",
]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    # Physics notation: single capitals are the standard symbols (N, E, I, k, V, Q).
    "N803", "N806", "N802", "N815",
    "E741",
    # Factory defaults such as `Field(default_factory=...)` and `SI("Hz")` are the
    # intended pydantic/annotation idiom, not accidental mutable defaults.
    "B008",
    # zip() over arrays of known equal length; strict= would add noise, not safety.
    "B905",
    # dict(...) reads better than a literal for keyword-style construction here.
    "C408",
]

[tool.mypy]
python_version = "3.11"
# Without this, every SAWSorterParams(frequency="6.632 MHz", ...) call reads as a
# type error: mypy sees the annotated field type and not the validator that
# accepts a unit string. The plugin teaches it the generated __init__.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
