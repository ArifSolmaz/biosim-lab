name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg
  PYVISTA_OFF_SCREEN: "true"

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Listed inline, not from a packages.txt: the hosted app deliberately has
      # no such file (its presence makes the host run apt-get update, and one
      # expired repository in the base image then fails the whole deploy). These
      # jobs still install OpenGL/X11 so the Gmsh and PyVista paths are covered
      # somewhere; the `streamlit` job below runs with none of them, which is
      # what the host actually does.
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglu1-mesa libxrender1 libxext6 \
            libsm6 libice6 libxcursor1 libxinerama1 libxft2 libfontconfig1 \
            libgomp1 xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mesh,dev]"

      - name: Lint
        run: ruff check biosim_lab tests examples streamlit_app.py

      - name: Tests
        run: pytest --cov=biosim_lab --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # The whole point of the plugin architecture is that the core works with no
  # optional back-end present. That claim is only true if something checks it.
  minimal:
    name: tests with no optional back-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core only (no gmsh, no pyvista, no napari)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests must still pass
        run: pytest -q
      - name: doctor must report, not crash
        run: biosim doctor

  # ---------------------------------------------------------------------------
  # Guards the class of bug that shipped a blank sweep heatmap: the script exits
  # 0, writes a valid PNG, and the PNG contains nothing. Unit tests cover the
  # specific case; this covers every figure the examples produce.
  figures:
    name: examples produce non-degenerate figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglu1-mesa libxrender1 libxext6 \
            libsm6 libice6 libxcursor1 libxinerama1 libxft2 libfontconfig1 \
            libgomp1 xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mesh,dev]" kaleido

      - name: Run the examples
        run: |
          python examples/01_single_cell.py
          python examples/02_ctc_vs_rbc.py
          python examples/03_parameter_sweep.py --quick
          python examples/04_validate_analytic_vs_fem.py
          python examples/05_impedance_rtca.py
          python examples/06_imaging_demo.py

      - name: No figure may be blank
        run: python scripts/check_figures.py assets

      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: assets/*.png

  # ---------------------------------------------------------------------------
  package:
    name: wheel builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install dist/*.whl
          # Entry points must resolve from an installed wheel, not just a checkout.
          /tmp/fresh/bin/biosim list
          /tmp/fresh/bin/biosim doctor

  # ---------------------------------------------------------------------------
  streamlit:
    name: hosted app imports and its manifests are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # NO system libraries on purpose: this job must match Streamlit Community
      # Cloud, which installs none. If anything here starts needing a shared
      # object, it has to fail in CI rather than in a hosting build log.
      - name: Install exactly what the host installs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: The app must import without the package being pip-installed
        run: python -c "import streamlit_app; print('pages:', list(streamlit_app.PAGES))"
      - name: Every page must actually render, not merely import
        # The app is split one module per page, so a name that quietly moved out
        # of scope gives a page that imports fine and raises at render time.
        run: |
          pip install pytest
          pytest tests/test_streamlit_app.py -q
      - name: Instruments must resolve from a bare checkout
        run: |
          python -c "
          from biosim_lab.registry import installed_instruments, discovery_source
          found = sorted(installed_instruments())
          print('instruments:', found)
          print('via:', discovery_source())
          assert len(found) == 4, found
          "

  # ---------------------------------------------------------------------------
  # Advisory only. There are 34 known errors as of this commit; the job exists so
  # the number is visible and can only go down, not to block anyone today.
  #
  # It read 88 before the pydantic mypy plugin was enabled in pyproject.toml.
  # Most of those were not real: mypy saw the annotated field type on
  # SAWSorterParams and not the validator that accepts "6.632 MHz", so every
  # construction call looked like a type error. The plugin teaches it the
  # generated __init__.
  types:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mypy
      - name: mypy
        run: mypy biosim_lab | tail -40
